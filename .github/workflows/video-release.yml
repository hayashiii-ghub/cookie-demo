name: Render video release

on:
  push:
    tags:
      - 'video-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: npm run video:prepare
      - run: npm run video:check:prepared
      - run: npm run video:render:prepared
      - uses: actions/upload-artifact@v4
        with:
          name: cookie-reel
          path: video/renders/cookie-reel.mp4
  release:
    if: startsWith(github.ref, 'refs/tags/video-v')
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cookie-reel
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes --title "COOKIE reel ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" cookie-reel.mp4 --repo "${GITHUB_REPOSITORY}" --clobber
